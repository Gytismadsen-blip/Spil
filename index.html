<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gytis' spil</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#111; color:#eee; }
  header { padding:2rem 1.5rem 1rem; }
  h1 { margin:0 0 .25rem; font-size:1.6rem; }
  .grid { display:grid; gap:1rem; padding:0 1.5rem 2rem; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
  a.card { display:block; background:#1c1c1c; border:1px solid #333; border-radius:10px; padding:1.25rem; color:#fff; text-decoration:none; }
  a.card:hover { border-color:#666; }
  a.card h2 { margin:0 0 .4rem; font-size:1.1rem; }
  a.card p { margin:0; color:#aaa; font-size:.9rem; }
</style>
</head>
<body>
<header><h1>Gytis' spil</h1></header>
<div class="grid">
  <a class="card" href="/animerpg/">
    <h2>AnimeRPG (3D)</h2>
    <p>3D anime-RPG, del 1: spiller og kamp. Unity WebGL, kan tage lidt tid at loade.</p>
  </a>
</div>
</body>
</html>
